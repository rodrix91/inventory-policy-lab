name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Coverage and static analysis are version-independent checks; run them once
    # on the middle supported Python instead of instrumenting the full suite
    # three times.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage combine
          coverage report

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Generated files are up to date
        run: |
          python scripts/generate_example.py --check
          python scripts/make_pareto_svg.py --check
          python scripts/update_readme_samples.py --check

  linux:
    # Keep explicit interpreter compatibility on the other supported versions
    # without repeating the expensive coverage/static-analysis pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra


  platforms:
    # Exercise OS-sensitive file identity and atomic-write behavior outside Linux.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra

  sdist:
    # Builds the source distribution and runs the test suite from the unpacked
    # archive, outside the checkout, so a file the tests need but MANIFEST.in
    # leaves out fails here instead of for whoever packages a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Build the source distribution
        run: python -m build --sdist --outdir "$RUNNER_TEMP/dist" .

      - name: Run the tests from the unpacked source distribution
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          python -m pip install --no-deps .
          python -m pytest -p no:cacheprovider

      - name: The installed command works
        run: |
          inventory-policy-lab --version
          inventory-policy-lab examples/worked_example.csv --holdout 2 --format json > /dev/null
