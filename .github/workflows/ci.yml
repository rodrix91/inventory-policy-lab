name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Coverage and static analysis are version-independent checks; run them once
    # on the middle supported Python instead of instrumenting the full suite
    # three times.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage combine
          coverage report

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Generated files are up to date
        run: |
          python scripts/generate_example.py --check
          python scripts/make_pareto_svg.py --check
          python scripts/update_readme_samples.py --check

  linux:
    # Keep explicit interpreter compatibility on the other supported versions
    # without repeating the expensive coverage/static-analysis pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra


  platforms:
    # Exercise OS-sensitive file identity and atomic-write behavior outside Linux.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra

  sdist:
    # Builds the source distribution and runs the test suite from the unpacked
    # archive, outside the checkout, so a file the tests need but MANIFEST.in
    # leaves out fails here instead of for whoever packages a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Build the source distribution
        run: python -m build --sdist --outdir "$RUNNER_TEMP/dist" .

      - name: Required project metadata is present in the source distribution
        run: |
          tar tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -Eq '^[^/]+/SECURITY\.md$'
          tar tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -Eq '^[^/]+/CITATION\.cff$'
          tar tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -Eq '^[^/]+/docs/README\.md$'

      - name: Run the tests from the unpacked source distribution
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          python -m pip install --no-deps .
          python - <<'PY'
          from pathlib import Path
          import inventory_policy_lab

          marker = Path(inventory_policy_lab.__file__).with_name("py.typed")
          assert marker.is_file(), marker
          PY
          python -m pytest -p no:cacheprovider

      - name: The installed command works
        run: |
          inventory-policy-lab --version
          inventory-policy-lab examples/worked_example.csv --holdout 2 --format json > /dev/null

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Action produces a JSON policy report
        id: report
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --holdout 2 --ordering-cost 30 --holding-rate 0.25
          format: json
          report-path: reports/action-report.json
          summary: "false"

      - name: Ragged demand export fails before inventory modelling
        id: ragged
        continue-on-error: true
        uses: ./
        with:
          path: examples/ragged-demand.csv
          args: --holdout 2
          format: json
          report-path: reports/ragged-report.json
          summary: "false"

      - name: Missing input fails cleanly
        id: missing
        continue-on-error: true
        uses: ./
        with:
          path: examples/not-there.csv
          args: --holdout 2
          report-path: reports/missing.md
          summary: "false"

      - name: Absolute report path is refused
        id: absolute
        continue-on-error: true
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --holdout 2
          report-path: ${{ runner.temp }}/inventory-action-absolute.json
          summary: "false"

      - name: Escaping report path is refused
        id: escape
        continue-on-error: true
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --holdout 2
          report-path: ../inventory-action-escape.json
          summary: "false"

      - name: Escaping input path is refused
        id: input-escape
        continue-on-error: true
        uses: ./
        with:
          path: ../outside-workspace.csv
          args: --holdout 2
          report-path: reports/unsafe-input.md
          summary: "false"

      - name: Absolute input path is refused
        id: input-absolute
        continue-on-error: true
        uses: ./
        with:
          path: ${{ github.workspace }}/examples/worked_example.csv
          args: --holdout 2
          report-path: reports/absolute-input.md
          summary: "false"

      - name: Refuse help even if a previous report already exists
        id: no-op-help
        continue-on-error: true
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --help
          format: json
          report-path: reports/action-report.json
          summary: "false"

      - name: Refuse abbreviated version even if a previous report exists
        id: no-op-version
        continue-on-error: true
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --ver
          format: json
          report-path: reports/action-report.json
          summary: "false"

      - name: Refuse argparse's abbreviated output switch
        id: alias-output
        continue-on-error: true
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --out=reports/bypass.json
          format: json
          report-path: reports/action-report.json
          summary: "false"

      - name: Verify Action outputs and report
        env:
          RAGGED_CODE: ${{ steps.ragged.outputs.exit-code }}
          RAGGED_SUCCEEDED: ${{ steps.ragged.outputs.succeeded }}
          RAGGED_PATH: ${{ steps.ragged.outputs.report-path }}
          RAGGED_OUTCOME: ${{ steps.ragged.outcome }}
          INPUT_ESCAPE_CODE: ${{ steps.input-escape.outputs.exit-code }}
          INPUT_ESCAPE_SUCCEEDED: ${{ steps.input-escape.outputs.succeeded }}
          INPUT_ESCAPE_PATH: ${{ steps.input-escape.outputs.report-path }}
          INPUT_ESCAPE_OUTCOME: ${{ steps.input-escape.outcome }}
          INPUT_ABSOLUTE_CODE: ${{ steps.input-absolute.outputs.exit-code }}
          INPUT_ABSOLUTE_SUCCEEDED: ${{ steps.input-absolute.outputs.succeeded }}
          INPUT_ABSOLUTE_PATH: ${{ steps.input-absolute.outputs.report-path }}
          INPUT_ABSOLUTE_OUTCOME: ${{ steps.input-absolute.outcome }}
          NOOP_HELP_CODE: ${{ steps.no-op-help.outputs.exit-code }}
          NOOP_HELP_SUCCEEDED: ${{ steps.no-op-help.outputs.succeeded }}
          NOOP_HELP_OUTCOME: ${{ steps.no-op-help.outcome }}
          NOOP_HELP_PATH: ${{ steps.no-op-help.outputs.report-path }}
          NOOP_VERSION_CODE: ${{ steps.no-op-version.outputs.exit-code }}
          NOOP_VERSION_SUCCEEDED: ${{ steps.no-op-version.outputs.succeeded }}
          NOOP_VERSION_OUTCOME: ${{ steps.no-op-version.outcome }}
          NOOP_VERSION_PATH: ${{ steps.no-op-version.outputs.report-path }}
          ALIAS_OUTPUT_CODE: ${{ steps.alias-output.outputs.exit-code }}
          ALIAS_OUTPUT_SUCCEEDED: ${{ steps.alias-output.outputs.succeeded }}
          ALIAS_OUTPUT_OUTCOME: ${{ steps.alias-output.outcome }}
          ALIAS_OUTPUT_PATH: ${{ steps.alias-output.outputs.report-path }}
          REPORT_CODE: ${{ steps.report.outputs.exit-code }}
          REPORT_SUCCEEDED: ${{ steps.report.outputs.succeeded }}
          REPORT_PATH: ${{ steps.report.outputs.report-path }}
          MISSING_CODE: ${{ steps.missing.outputs.exit-code }}
          MISSING_SUCCEEDED: ${{ steps.missing.outputs.succeeded }}
          MISSING_PATH: ${{ steps.missing.outputs.report-path }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
          ABSOLUTE_CODE: ${{ steps.absolute.outputs.exit-code }}
          ABSOLUTE_SUCCEEDED: ${{ steps.absolute.outputs.succeeded }}
          ABSOLUTE_PATH: ${{ steps.absolute.outputs.report-path }}
          ABSOLUTE_OUTCOME: ${{ steps.absolute.outcome }}
          ESCAPE_CODE: ${{ steps.escape.outputs.exit-code }}
          ESCAPE_SUCCEEDED: ${{ steps.escape.outputs.succeeded }}
          ESCAPE_PATH: ${{ steps.escape.outputs.report-path }}
          ESCAPE_OUTCOME: ${{ steps.escape.outcome }}
        run: |
          test "$RAGGED_CODE" = 4
          test "$RAGGED_SUCCEEDED" = false
          test -z "$RAGGED_PATH"
          test "$RAGGED_OUTCOME" = failure
          test ! -e reports/ragged-report.json
          test "$INPUT_ESCAPE_CODE" = 2
          test "$INPUT_ESCAPE_SUCCEEDED" = false
          test -z "$INPUT_ESCAPE_PATH"
          test "$INPUT_ESCAPE_OUTCOME" = failure
          test ! -e reports/unsafe-input.md
          test "$INPUT_ABSOLUTE_CODE" = 2
          test "$INPUT_ABSOLUTE_SUCCEEDED" = false
          test -z "$INPUT_ABSOLUTE_PATH"
          test "$INPUT_ABSOLUTE_OUTCOME" = failure
          test ! -e reports/absolute-input.md
          test "$NOOP_HELP_CODE" = 2
          test "$NOOP_HELP_SUCCEEDED" = false
          test "$NOOP_HELP_OUTCOME" = failure
          test -z "$NOOP_HELP_PATH"
          test "$NOOP_VERSION_CODE" = 2
          test "$NOOP_VERSION_SUCCEEDED" = false
          test "$NOOP_VERSION_OUTCOME" = failure
          test -z "$NOOP_VERSION_PATH"
          test "$ALIAS_OUTPUT_CODE" = 2
          test "$ALIAS_OUTPUT_SUCCEEDED" = false
          test "$ALIAS_OUTPUT_OUTCOME" = failure
          test -z "$ALIAS_OUTPUT_PATH"
          test ! -f reports/bypass.json
          test "$REPORT_CODE" = 0
          test "$REPORT_SUCCEEDED" = true
          test -n "$REPORT_PATH"
          test -f "$REPORT_PATH"
          test "$MISSING_CODE" = 3
          test "$MISSING_SUCCEEDED" = false
          test -z "$MISSING_PATH"
          test "$MISSING_OUTCOME" = failure
          test ! -e reports/missing.md
          test "$ABSOLUTE_CODE" = 2
          test "$ABSOLUTE_SUCCEEDED" = false
          test -z "$ABSOLUTE_PATH"
          test "$ABSOLUTE_OUTCOME" = failure
          test ! -e "$RUNNER_TEMP/inventory-action-absolute.json"
          test "$ESCAPE_CODE" = 2
          test "$ESCAPE_SUCCEEDED" = false
          test -z "$ESCAPE_PATH"
          test "$ESCAPE_OUTCOME" = failure
          test ! -e "$GITHUB_WORKSPACE/../inventory-action-escape.json"
          python - <<'PY'
          import json
          import os

          with open(os.environ["REPORT_PATH"], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["tool"] == "inventory-policy-lab", report["tool"]
          assert report["summary"]["skus"] == 2, report["summary"]
          assert report["settings"]["holdout"] == 2, report["settings"]
          PY
