name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Coverage and static analysis are version-independent checks; run them once
    # on the middle supported Python instead of instrumenting the full suite
    # three times.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage combine
          coverage report

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Generated files are up to date
        run: |
          python scripts/generate_example.py --check
          python scripts/make_pareto_svg.py --check
          python scripts/update_readme_samples.py --check

  linux:
    # Keep explicit interpreter compatibility on the other supported versions
    # without repeating the expensive coverage/static-analysis pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra


  platforms:
    # Exercise OS-sensitive file identity and atomic-write behavior outside Linux.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -p no:cacheprovider -ra

  sdist:
    # Builds the source distribution and runs the test suite from the unpacked
    # archive, outside the checkout, so a file the tests need but MANIFEST.in
    # leaves out fails here instead of for whoever packages a release.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Build the source distribution
        run: python -m build --sdist --outdir "$RUNNER_TEMP/dist" .

      - name: Required project metadata is present in the source distribution
        run: |
          tar tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -Eq '^[^/]+/SECURITY\.md$'
          tar tzf "$RUNNER_TEMP"/dist/*.tar.gz | grep -Eq '^[^/]+/CITATION\.cff$'

      - name: Run the tests from the unpacked source distribution
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          python -m pip install --no-deps .
          python - <<'PY'
          from pathlib import Path
          import inventory_policy_lab

          marker = Path(inventory_policy_lab.__file__).with_name("py.typed")
          assert marker.is_file(), marker
          PY
          python -m pytest -p no:cacheprovider

      - name: The installed command works
        run: |
          inventory-policy-lab --version
          inventory-policy-lab examples/worked_example.csv --holdout 2 --format json > /dev/null

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Action produces a JSON policy report
        id: report
        uses: ./
        with:
          path: examples/worked_example.csv
          args: --holdout 2 --ordering-cost 30 --holding-rate 0.25
          format: json
          report-path: reports/action-report.json
          summary: "false"

      - name: Missing input fails cleanly
        id: missing
        continue-on-error: true
        uses: ./
        with:
          path: examples/not-there.csv
          args: --holdout 2
          report-path: reports/missing.md
          summary: "false"

      - name: Verify Action outputs and report
        env:
          REPORT_CODE: ${{ steps.report.outputs.exit-code }}
          REPORT_SUCCEEDED: ${{ steps.report.outputs.succeeded }}
          REPORT_PATH: ${{ steps.report.outputs.report-path }}
          MISSING_CODE: ${{ steps.missing.outputs.exit-code }}
          MISSING_SUCCEEDED: ${{ steps.missing.outputs.succeeded }}
          MISSING_PATH: ${{ steps.missing.outputs.report-path }}
          MISSING_OUTCOME: ${{ steps.missing.outcome }}
        run: |
          test "$REPORT_CODE" = 0
          test "$REPORT_SUCCEEDED" = true
          test -n "$REPORT_PATH"
          test -f "$REPORT_PATH"
          test "$MISSING_CODE" = 3
          test "$MISSING_SUCCEEDED" = false
          test -z "$MISSING_PATH"
          test "$MISSING_OUTCOME" = failure
          test ! -e reports/missing.md
          python - <<'PY'
          import json
          import os

          with open(os.environ["REPORT_PATH"], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["tool"] == "inventory-policy-lab", report["tool"]
          assert report["summary"]["skus"] == 2, report["summary"]
          assert report["settings"]["holdout"] == 2, report["settings"]
          PY
